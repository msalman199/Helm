# Development environment values
replicaCount: 1

image:
  repository: simple-microservice
  tag: "v1.0.0"
  pullPolicy: IfNotPresent

service:
  type: NodePort
  port: 80
  targetPort: 3000
  nodePort: 30080

env:
  - name: NODE_ENV
    value: "development"
  - name: LOG_LEVEL
    value: "debug"
  - name: DEBUG
    value: "true"

config:
  enabled: true
  data:
    app.name: "Dev Microservice"
    app.environment: "development"
    app.debug: "true"
    app.logLevel: "debug"

resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

global:
  environment: development
