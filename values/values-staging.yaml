global:
  environment: staging
  monitoring:
    enabled: true

replicaCount: 2

image:
  tag: "1.25"

resources:
  limits:
    cpu: 250m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

env:
  - name: APP_ENV
    value: "staging"
  - name: LOG_LEVEL
    value: "info"

configMap:
  enabled: true
  data:
    app.properties: |
      app.name=webapp-staging
      log.level=info
      database.pool.size=10
      monitoring.enabled=true
