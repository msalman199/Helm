replicaCount: 1

image:
  repository: httpd
  pullPolicy: IfNotPresent
  tag: "2.4"

nameOverride: ""
fullnameOverride: ""

service:
  type: NodePort
  port: 8080
  targetPort: 80

ingress:
  enabled: true
  className: ""
  annotations: {}
  hosts:
    - host: webapp.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

nodeSelector: {}
tolerations: []
affinity: {}

application:
  name: "WebApp-v2"
  version: "v2.0.0"
  environment: "production"
  database:
    enabled: true
    type: "postgresql"
  cache:
    enabled: true
    type: "redis"
  features:
    - "oauth2"
    - "advanced-logging"
    - "metrics"
    - "health-checks"
    - "api-gateway"
    - "rate-limiting"

monitoring:
  enabled: true
  prometheus:
    enabled: true
    port: 9090
  grafana:
    enabled: true
    port: 3000
