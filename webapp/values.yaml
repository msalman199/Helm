# Default values for webapp
replicaCount: 2

image:
  repository: nginx
  pullPolicy: IfNotPresent
  tag: "1.21"

nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 80
  targetPort: 80

ingress:
  enabled: false

resources:
  limits:
    cpu: 100m
    memory: 128Mi
  requests:
    cpu: 100m
    memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

# Custom application configuration
app:
  name: "My Custom Web App"
  environment: "development"
  debug: true
  database:
    host: "localhost"
    port: 5432
    name: "webapp_db"

# Custom labels
customLabels:
  team: "development"
  project: "helm-lab"

# Database password (will create secret)
app:
  database:
    password: "mysecretpassword"
